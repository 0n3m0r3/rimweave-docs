    id: ResolveExclusiveClaim
    path: RimWeave/Health/ContributionQueries.cs
    startLine: 48
  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: Reports an explicit exclusive-ownership conflict without selecting a winner.
  remarks: Native callback observers are not claimants. Unclaimed effects do not compete here.
  example: []
  syntax:
    content: public static ContributionLookupResult<ContributionHediff> ResolveExclusiveClaim(Pawn pawn, string
      responsibility, BodyPartRecord? part = null)
    parameters:
    - id: pawn
      type: Verse.Pawn
      description: The native owner with an initialized health tracker.
    - id: responsibility
      type: System.String
      description: The exact exclusive responsibility key to match.
    - id: part
      type: Verse.BodyPartRecord
      description: The exact body-part reference, or null for whole-body effects only.
    return:
      type: RimWeave.Contributions.ContributionLookupResult{RimWeave.Health.ContributionHediff}
      description: The explicit claimants and unreadable candidates; InvalidMetadata takes precedence over claim
        counts.
  overload: RimWeave.Health.ContributionQueries.ResolveExclusiveClaim*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The pawn is null.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The responsibility key is null, blank or has surrounding whitespace.
