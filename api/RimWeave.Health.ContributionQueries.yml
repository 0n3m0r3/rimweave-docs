    id: Find
    path: RimWeave/Health/ContributionQueries.cs
    startLine: 20
  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: Reads exact matches from native health state. Null part means whole-body only.
  remarks: 'The returned collection is a snapshot of references, not a frozen copy of the effects.

    A BodyPartRecord identifies a native body slot, not the lifetime of a biological organ.

    Read on the simulation thread. The native health list remains authoritative.'
  example: []
  syntax:
    content: public static IReadOnlyList<ContributionHediff> Find(Pawn pawn, ContributionId contribution, BodyPartRecord?
      part = null)
    parameters:
    - id: pawn
      type: Verse.Pawn
      description: The native owner with an initialized health tracker.
    - id: contribution
      type: RimWeave.Contributions.ContributionId
      description: The identity to match.
    - id: part
      type: Verse.BodyPartRecord
      description: The exact body-part reference, or null for whole-body effects only.
    return:
      type: System.Collections.Generic.IReadOnlyList{RimWeave.Health.ContributionHediff}
      description: A read-only membership snapshot of all matching contribution effects.
  overload: RimWeave.Health.ContributionQueries.Find*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The pawn or identity is null.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Saved metadata in the scope is unreadable; use Resolve to inspect the incomplete result.
