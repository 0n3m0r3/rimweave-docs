    id: Resolve
    path: RimWeave/Health/ContributionQueries.cs
    startLine: 36
  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: Resolves an identity on one pawn and one exact native body-part scope.
  remarks: Call on the simulation thread. Only ContributionHediff instances are selected.
  example: []
  syntax:
    content: public static ContributionLookupResult<ContributionHediff> Resolve(Pawn pawn, ContributionId contribution,
      BodyPartRecord? part = null)
    parameters:
    - id: pawn
      type: Verse.Pawn
      description: The native owner with an initialized health tracker.
    - id: contribution
      type: RimWeave.Contributions.ContributionId
      description: The identity to match.
    - id: part
      type: Verse.BodyPartRecord
      description: The exact body-part reference, or null for whole-body effects only.
    return:
      type: RimWeave.Contributions.ContributionLookupResult{RimWeave.Health.ContributionHediff}
      description: Unreadable metadata, no match, one match or ambiguity; no native mutation is performed.
  overload: RimWeave.Health.ContributionQueries.Resolve*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The pawn or identity is null.
