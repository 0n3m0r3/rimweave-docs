  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: A native health effect whose contribution must retain its own lifetime.
  remarks: 'Opt in through an extension''s HediffDef. This does not alter ordinary Hediffs or

    prevent unrelated patches from changing native behavior. Call on the simulation thread.'
  example: []
  syntax:
    content: 'public class ContributionHediff : HediffWithComps, IExposable, ILoadReferenceable, IContribution'
