    id: NativeReferenceSnapshot
    path: RimWeave/References/NativeReferenceSnapshot.cs
    startLine: 25
  assemblies:
  - RimWeave
  namespace: RimWeave.References
  summary: A passive observation of native identity, location and attachment at one instant.
  remarks: 'A resolved dead, destroyed or detached object is not necessarily usable by an operation.

    Map presence does not establish reachability, reservation, willingness or business eligibility.

    The referenced native objects remain mutable; inspect again before a later operation.'
  example: []
  syntax:
    content: 'public sealed record NativeReferenceSnapshot : IEquatable<NativeReferenceSnapshot>'
