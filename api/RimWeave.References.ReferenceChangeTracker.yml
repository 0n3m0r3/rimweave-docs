  namespace: RimWeave.References
  summary: Retains unacknowledged transition kinds independently of a provider's entities or storage.
  remarks: 'Use on the simulation thread. Recording never invokes a consumer or decides a gameplay outcome.

    Each consumer owns its tracker; acknowledging one tracker cannot consume another''s observations.'
