  assemblies:
  - RimWeave
  namespace: RimWeave.Contributions
  summary: Attribution and provenance shared by contributions with different native owners.
  remarks: 'Metadata does not register, attach, serialize or apply a contribution.

    Missing attribution remains unknown. The containing owner controls its lifetime.

    When LoadError is present, values are unavailable rather than absent and mutations are refused.

    Mutate metadata on the owning domain''s thread.'
  example: []
  syntax:
    content: public sealed class ContributionMetadata
  inheritance:
