  assemblies:
  - RimWeave
  namespace: RimWeave.Contributions
  summary: Declares an exclusive claim without choosing a winner or applying an effect.
  remarks: Equal claims are accepted again. Providers agree on key semantics and query scope.
  example: []
  syntax:
    content: public void ClaimExclusiveResponsibility(string responsibility)
    parameters:
    - id: responsibility
      type: System.String
      description: A nonblank, case-sensitive key with no surrounding whitespace.
  overload: RimWeave.Contributions.ContributionMetadata.ClaimExclusiveResponsibility*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The key is null, blank or has surrounding whitespace.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: A different responsibility has already been declared, or saved metadata is unavailable.
