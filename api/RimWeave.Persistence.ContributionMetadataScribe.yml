  assemblies:
  - RimWeave
  namespace: RimWeave.Persistence
  summary: Persists shared contribution metadata inside an owner's native Scribe node.
  remarks: 'The owner calls ExposeData once in each native save/load phase and exposes Metadata to consumers.

    This adapter does not save the owner, resolve sources or apply effects. Unreadable metadata is

    retained as opaque XML text on subsequent saves; it requires an explicit future recovery policy.'
  example: []
  syntax:
    content: 'public sealed class ContributionMetadataScribe : IExposable'
