  namespace: RimWeave.Contributions
  summary: An extensible origin type identified by a namespace and a case-sensitive local key.
  remarks: 'Any provider can define a type without registration or a framework update.

    The namespace identifies the type''s vocabulary, not the contribution''s owner or source owner.

    Equal namespace/key pairs denote the same type; providers define their meaning cooperatively.'
  example: []
  syntax:
    content: 'public sealed record ContributionOriginType : IEquatable<ContributionOriginType>'
