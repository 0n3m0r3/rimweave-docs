    id: Remove
    path: RimWeave/Health/ContributionOperations.cs
    startLine: 94
  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: Attempts to remove the unique contribution on the requested pawn and body part.
  remarks: 'Null part means whole-body effects only. Missing, ambiguous or unreadable metadata does not

    trigger native removal. Exclusive-claim conflicts do not prevent cleanup of a uniquely identified effect.

    Call on the simulation thread. Attribution is not an authorization boundary.

    Native exceptions propagate and may follow partial changes; no rollback is promised.'
  example: []
  syntax:
    content: public static ContributionRemovalResult Remove(Pawn pawn, ContributionId contribution, BodyPartRecord?
      part = null)
    parameters:
    - id: pawn
      type: Verse.Pawn
      description: The native owner whose health list is queried.
    - id: contribution
      type: RimWeave.Contributions.ContributionId
      description: The contribution identity to resolve.
    - id: part
      type: Verse.BodyPartRecord
      description: The exact body-part reference, or null for whole-body effects only.
    return:
      type: RimWeave.Health.ContributionRemovalResult
      description: The lookup snapshot and an optional guarded-removal outcome.
  overload: RimWeave.Health.ContributionOperations.Remove*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The pawn or contribution identity is null.
