  namespace: RimWeave.Contributions
  summary: Returns every candidate with the requested identity, without modifying storage.
  remarks: Enumeration and provider exceptions propagate. A match does not reserve an instance.
  example: []
  syntax:
    content: 'public static ContributionLookupResult<T> Resolve<T>(IEnumerable<T> candidates, ContributionId identity)
      where T : class, IContribution'
    parameters:
    - id: candidates
      type: System.Collections.Generic.IEnumerable{{T}}
      description: The authoritative candidates in a scope already selected by the caller.
    - id: identity
      type: RimWeave.Contributions.ContributionId
      description: The attribution value to match.
    typeParameters:
    - id: T
      description: The caller's contribution type.
    return:
      type: RimWeave.Contributions.ContributionLookupResult{{T}}
      description: A read-only snapshot reporting invalid metadata, no match, one match or multiple matches.
