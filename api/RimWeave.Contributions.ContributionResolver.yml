    id: ResolveExclusiveClaim
    path: RimWeave/Contributions/ContributionResolver.cs
    startLine: 36
  assemblies:
  - RimWeave
  namespace: RimWeave.Contributions
  summary: Finds explicit exclusive claimants without treating ordinary observers as owners.
  remarks: This query neither discovers arbitrary effects nor infers their gameplay compatibility.
  example: []
  syntax:
    content: 'public static ContributionLookupResult<T> ResolveExclusiveClaim<T>(IEnumerable<T> candidates, string
      responsibility) where T : class, IContribution'
    parameters:
    - id: candidates
      type: System.Collections.Generic.IEnumerable{{T}}
      description: The authoritative candidates in one selected responsibility scope.
    - id: responsibility
      type: System.String
      description: The exact, case-sensitive key agreed by cooperating providers.
    typeParameters:
    - id: T
      description: The caller's contribution type.
    return:
      type: RimWeave.Contributions.ContributionLookupResult{{T}}
      description: A snapshot reporting invalid metadata before considering the number of explicit claimants.
  overload: RimWeave.Contributions.ContributionResolver.ResolveExclusiveClaim*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The candidate sequence is null.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The key is invalid or a candidate is null.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: A candidate exposes null metadata.
