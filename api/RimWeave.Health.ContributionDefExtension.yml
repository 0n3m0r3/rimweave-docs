    id: Read
    path: RimWeave/Health/ContributionDefExtension.cs
    startLine: 59
  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: Reads a fresh metadata snapshot from an optional health definition declaration.
  remarks: 'Uses the same validation as native configuration diagnostics and effect creation.

    Editing the returned metadata does not change the definition or any other instance.

    Origin and source remain the consumer''s responsibility. No gameplay operation is performed.'
  example: []
  syntax:
    content: public static ContributionMetadata? Read(HediffDef definition)
    parameters:
    - id: definition
      type: Verse.HediffDef
      description: The native definition to inspect on the simulation thread.
    return:
      type: RimWeave.Contributions.ContributionMetadata
      description: Independent metadata, or null when the definition has no contribution declaration.
  overload: RimWeave.Health.ContributionDefExtension.Read*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The definition is null.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: The declaration is invalid, duplicated or incompatible.
