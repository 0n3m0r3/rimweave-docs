  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: Declares initial attribution in a cooperating health effect's native XML definition.
  remarks: 'Add at most one instance to a HediffDef using ContributionHediff or a subclass.

    Declarations affect newly created instances only; saved metadata remains authoritative.

    Definitions may share an identity. This declaration neither registers nor applies an effect.'
  example: []
  syntax:
    content: 'public sealed class ContributionDefExtension : DefModExtension'
