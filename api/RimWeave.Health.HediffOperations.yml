    id: Remove
    path: RimWeave/Health/HediffOperations.cs
    startLine: 25
  assemblies:
  - RimWeave
  namespace: RimWeave.Health
  summary: Removes an attached instance through its pawn's native health tracker.
  remarks: 'Call on the simulation thread. The result describes attachment to the

    requested pawn after a normal return; it does not describe all side effects.

    Reentrant removal of the same attached instance returns AlreadyRemoving without invoking

    native callbacks again. Other instances and later removal attempts remain independent.

    Native exceptions propagate and may follow partial changes; the temporary guard is always released.'
  example: []
  syntax:
    content: public static HediffRemovalResult Remove(Pawn pawn, Hediff hediff)
    parameters:
    - id: pawn
      type: Verse.Pawn
      description: The requested owner with an initialized native health tracker.
    - id: hediff
      type: Verse.Hediff
      description: The exact native effect instance, including an ordinary non-RimWeave Hediff.
    return:
      type: RimWeave.Health.HediffRemovalResult
      description: An observed attachment outcome; inspect Status rather than assuming success.
  overload: RimWeave.Health.HediffOperations.Remove*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: The pawn or effect is null.
